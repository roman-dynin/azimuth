services:

  db:
    image: postgres:18-alpine
    env_file:
      - docker/db.env
    ports:
      - '5432:5432'
    volumes:
      - ./docker/.data/db:/var/lib/postgresql
    restart: unless-stopped

  azimuth:
    image: ghcr.io/roman-dynin/azimuth:latest
    env_file:
      - .env
    environment:
      PHOTOS_DIR: /data/photos
    ports:
      - '3000:3000'
    volumes:
      - ./docker/.data/photos:/data/photos
    restart: unless-stopped
